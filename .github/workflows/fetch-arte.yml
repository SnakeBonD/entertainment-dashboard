name: Refresh ARTE selection

on:
  schedule:
    - cron: "41 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-arte.yml"
      - "scripts/arte.mjs"
      - "scripts/fetch-arte.mjs"

permissions:
  contents: write

concurrency:
  group: catalogue-maintenance
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch the official ARTE selection for France
        run: node scripts/fetch-arte.mjs

      - name: Archive expired entries
        run: node scripts/archive-expired.mjs

      - name: Validate updated catalogue
        run: |
          node scripts/validate.mjs
          node scripts/test-availability.mjs
          node scripts/test-epic-games.mjs
          node scripts/test-arte.mjs

      - name: Publish catalogue update
        run: |
          if git diff --quiet -- data/catalogue.json data/archive.json; then
            echo "No ARTE catalogue change."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalogue.json data/archive.json
          git commit -m "chore: refresh ARTE selection"
          git push
