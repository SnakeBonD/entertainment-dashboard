name: Refresh ARTE selection

on:
  schedule:
    - cron: "41 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: catalogue-maintenance
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch the official ARTE selection for France
        run: node scripts/fetch-arte.mjs

      - name: Archive expired entries
        run: node scripts/archive-expired.mjs

      - name: Validate updated catalogue
        run: |
          node scripts/validate.mjs
          node scripts/test-availability.mjs
          node scripts/test-epic-games.mjs
          node scripts/test-arte.mjs
          node scripts/test-radio-france.mjs

      - name: Publish catalogue update
        id: publish
        run: |
          if git diff --quiet -- data/catalogue.json data/archive.json data/source-status.json; then
            echo "No ARTE catalogue change."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalogue.json data/archive.json data/source-status.json
          git commit -m "chore: refresh ARTE selection"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy updated catalogue
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
