name: Refresh Radio France podcasts

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fetch-radio-france.yml"
      - "scripts/radio-france.mjs"
      - "scripts/fetch-radio-france.mjs"

permissions:
  contents: write
  actions: write

concurrency:
  group: catalogue-maintenance
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Fetch official Radio France podcast feeds
        run: node scripts/fetch-radio-france.mjs

      - name: Validate updated selection
        run: |
          node scripts/validate.mjs
          node scripts/test-radio-france.mjs

      - name: Publish podcast update
        id: publish
        run: |
          if git diff --quiet -- data/radio-france.json data/source-status.json; then
            echo "No Radio France selection change."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/radio-france.json data/source-status.json
          git commit -m "chore: refresh Radio France podcasts"
          git pull --rebase origin main
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy podcast update
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
