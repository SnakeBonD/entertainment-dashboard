name: Archive expired content

on:
  schedule:
    - cron: "40 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: catalogue-maintenance
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Archive expired entries
        run: node scripts/archive-expired.mjs

      - name: Validate updated data
        run: |
          node scripts/validate.mjs
          node scripts/test-availability.mjs
          node scripts/test-epic-games.mjs
          node scripts/test-arte.mjs

      - name: Publish archive update
        id: publish
        run: |
          if git diff --quiet -- data/catalogue.json data/archive.json; then
            echo "No expired content to archive."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalogue.json data/archive.json
          git commit -m "chore: archive expired entertainment content"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy archive update
        if: steps.publish.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
